<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line Material Reconciliation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#1c2430;--mute:#6b7480;--line:#d9d7cf;--acc:#f2b705;--accink:#1c2430;--ok:#1f7a4d;--bad:#c23a2b;--warn:#a86a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--card:#1d2530;--ink:#eceae3;--mute:#9aa3ae;--line:#323c49;--ok:#4cc38a;--bad:#ff7a6b;--warn:#f2b705}}
:root[data-theme="dark"]{--bg:#141a22;--card:#1d2530;--ink:#eceae3;--mute:#9aa3ae;--line:#323c49;--ok:#4cc38a;--bad:#ff7a6b;--warn:#f2b705}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:12px 14px 96px}
h1{font-size:20px;margin:6px 0 2px;font-weight:600}h2{font-size:15px;margin:18px 0 8px;font-weight:600}
.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
input[type=text],input[type=date]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row .n{flex:1;min-width:0}.row small{color:var(--mute);display:block;font-size:12px}
.st{display:flex;align-items:center;gap:4px}
.st button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;line-height:1}
.st input{width:52px;height:38px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:600 16px inherit}
.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--acc);color:var(--accink);font:600 15px inherit}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mute);font:500 14px inherit;border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--acc);font-weight:600}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.t-ok{color:var(--ok);border:1px solid var(--ok)}.t-ret{color:var(--warn);border:1px solid var(--warn)}.t-bad{color:var(--bad);border:1px solid var(--bad)}
.bom{font-size:13px;color:var(--mute);margin:2px 0 6px}
.sum{display:flex;gap:8px;margin-bottom:10px}.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.sum b{display:block;font-size:22px}.sum span{font-size:12px;color:var(--mute)}
.add{display:flex;gap:6px}.jc{border-left:4px solid transparent}.jc.cur{border-left-color:var(--acc)}.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.btn.sm{padding:8px 12px;font-size:14px}.btn.bad{color:var(--bad);border-color:var(--bad)}#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}.add input{margin:0}
</style></head><body><main id="app"></main>
<nav id="nav"></nav><div id="toast"></div>
<script>
const KEY="linerec.v2",OLD="linerec.v1";
const M=[["pole","Pole","pcs"],["xarm","Cross arm","pcs"],["pin","Pin insulator","pcs"],["strain","Strain insulator","pcs"],["stay","Stay set","sets"],["earth","Earth rod","pcs"]];
const T=[["int","Intermediate pole",{pole:1,xarm:1,pin:3}],["light","Light angle pole",{pole:1,xarm:1,pin:3,stay:1}],["heavy","Heavy angle pole",{pole:2,xarm:2,strain:6,stay:2}],["dead","Dead-end pole",{pole:1,xarm:1,strain:3,stay:1}],["tee","Tee-off pole",{pole:1,xarm:2,pin:3,strain:3,stay:1}]];
const today=()=>new Date().toISOString().slice(0,10);
const clone=o=>JSON.parse(JSON.stringify(o));
function newJob(from){const b=from||{mats:M.map(m=>({id:m[0],name:m[1],unit:m[2]})),types:T.map(t=>({id:t[0],name:t[1],bom:{...t[2]}}))};
 return{id:"j"+Date.now()+Math.floor(Math.random()*999),name:"",contractor:"",date:today(),mats:clone(b.mats),types:clone(b.types),issued:{},extra:{},built:{},updated:Date.now()}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d.jobs&&d.jobs.length)return d}}catch(e){}
 try{const o=JSON.parse(localStorage.getItem(OLD));if(o&&o.mats){const j={...o.job,id:"j1",mats:o.mats,types:o.types,issued:o.issued||{},extra:o.extra||{},built:o.built||{},updated:Date.now()};return{jobs:[j],cur:"j1"}}}catch(e){}
 const j=newJob();return{jobs:[j],cur:j.id}}
let S=load(),tab="jobs",editing=null,delC=null;
const J=()=>S.jobs.find(j=>j.id===S.cur)||S.jobs[0];
function save(){const j=J();if(j)j.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save: storage is full or blocked")}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2400)}
const n=v=>Math.max(0,parseInt(v)||0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function used(j,id){let u=n(j.extra[id]);j.types.forEach(t=>u+=n(j.built[t.id])*n(t.bom[id]));return u}
function calc(j){return j.mats.map(m=>{const i=n(j.issued[m.id]),u=used(j,m.id);return{m,i,u,b:i-u}})}
const status=b=>b>0?"Return "+b:b<0?"Short "+(-b):"Balanced";
function stepper(k,id,v){return `<div class="st"><button data-act="d" data-k="${k}" data-id="${id}" data-d="-1" aria-label="minus">−</button><input type="number" inputmode="numeric" min="0" value="${n(v)}" data-k="${k}" data-id="${id}"><button data-act="d" data-k="${k}" data-id="${id}" data-d="1" aria-label="plus">+</button></div>`}
function getBag(k,id){const j=J();return k==="bom"?j.types.find(t=>t.id===editing).bom:j[k]}
const title=j=>j.name||"Untitled job";
function jobsView(){
 return `<h1>Jobs</h1><p class="sub">Every change is saved automatically on this device. Open a job to continue it.</p>
 <div class="acts" style="margin:0 0 12px"><button class="btn" data-act="newjob">+ New job</button><button class="btn g" data-act="expall">Export all to Excel</button></div>
 ${S.jobs.slice().sort((a,b)=>b.updated-a.updated).map(j=>{const poles=j.types.reduce((s,t)=>s+n(j.built[t.id]),0),sh=calc(j).filter(x=>x.b<0).length;
 return `<div class="card jc ${j.id===S.cur?"cur":""}"><b>${esc(title(j))}</b>${j.id===S.cur?' <span class="tag t-ok">Open</span>':""}
 <div class="bom">${esc(j.contractor||"No contractor")} · ${j.date} · ${poles} structures${sh?` · <span style="color:var(--bad)">${sh} short</span>`:""}</div>
 <div class="acts"><button class="btn sm" data-act="open" data-id="${j.id}">Open</button><button class="btn sm g" data-act="dup" data-id="${j.id}">Duplicate</button><button class="btn sm g" data-act="expone" data-id="${j.id}">Excel</button><button class="btn sm g bad" data-act="del" data-id="${j.id}">${delC===j.id?"Tap to confirm":"Delete"}</button></div></div>`}).join("")}`}
function jobView(){const j=J();
 return `<h1>Issued materials</h1><p class="sub">Job details, then what was issued to the contractor.</p>
 <div class="card"><input type="text" id="jn" placeholder="Job / line name" value="${esc(j.name)}"><input type="text" id="jc" placeholder="Contractor" value="${esc(j.contractor)}"><input type="date" id="jd" value="${j.date}" style="margin:0"></div>
 <h2>Materials issued</h2><div class="card">${j.mats.map(m=>`<div class="row"><div class="n">${esc(m.name)}<small>${esc(m.unit)}</small></div>${stepper("issued",m.id,j.issued[m.id])}</div>`).join("")}</div>
 <h2>Add another material</h2><div class="add"><input type="text" id="nm" placeholder="e.g. Stay wire"><input type="text" id="nu" placeholder="unit" style="width:80px"><button class="btn" data-act="addmat">Add</button></div>`}
function bomText(j,t){return j.mats.filter(m=>n(t.bom[m.id])).map(m=>`${t.bom[m.id]} ${m.name.toLowerCase()}`).join(", ")||"No materials set"}
function builtView(){const j=J();
 return `<h1>Structures built</h1><p class="sub">${esc(title(j))}. Count each pole type completed; materials used are worked out from the list under each type.</p>
 ${j.types.map(t=>`<div class="card"><div class="row" style="border:0"><div class="n"><b>${esc(t.name)}</b></div>${stepper("built",t.id,j.built[t.id])}</div><div class="bom">${esc(bomText(j,t))}</div>
 <button class="btn g" data-act="edit" data-id="${t.id}">${editing===t.id?"Done":"Edit materials"}</button>
 ${editing===t.id?`<div style="margin-top:8px">${j.mats.map(m=>`<div class="row"><div class="n">${esc(m.name)}</div>${stepper("bom",m.id,t.bom[m.id])}</div>`).join("")}</div>`:""}</div>`).join("")}
 <h2>Add a pole type</h2><div class="add"><input type="text" id="nt" placeholder="e.g. Double-circuit pole"><button class="btn" data-act="addtype">Add</button></div>`}
function recView(){const j=J(),r=calc(j),ret=r.filter(x=>x.b>0).length,sh=r.filter(x=>x.b<0).length;
 return `<h1>Reconciliation</h1><p class="sub">${esc(title(j))}${j.contractor?" · "+esc(j.contractor):""} · ${j.date}</p>
 <div class="sum"><div><b>${ret}</b><span>to return</span></div><div><b style="color:${sh?"var(--bad)":"inherit"}">${sh}</b><span>short</span></div></div>
 <div class="card">${r.map(x=>{const tag=x.b>0?`<span class="tag t-ret">${status(x.b)}</span>`:x.b<0?`<span class="tag t-bad">${status(x.b)}</span>`:`<span class="tag t-ok">Balanced</span>`;
 return `<div class="row"><div class="n">${esc(x.m.name)}<small>Issued ${x.i} · Used ${x.u}</small></div>${tag}</div>`}).join("")}</div>
 <h2>Other usage not on a pole</h2><p class="sub">Spares, damaged or lost items, or extra fittings counted on site.</p>
 <div class="card">${j.mats.map(m=>`<div class="row"><div class="n">${esc(m.name)}</div>${stepper("extra",m.id,j.extra[m.id])}</div>`).join("")}</div>
 <div class="acts"><button class="btn" data-act="expone" data-id="${j.id}">Export to Excel</button><button class="btn g" data-act="copy">Copy summary</button></div>`}
function render(){
 document.getElementById("app").innerHTML=tab==="jobs"?jobsView():tab==="job"?jobView():tab==="built"?builtView():recView();
 document.getElementById("nav").innerHTML=[["jobs","Jobs"],["job","Issued"],["built","Built"],["rec","Reconcile"]].map(t=>`<button data-act="tab" data-id="${t[0]}" class="${tab===t[0]?"on":""}">${t[1]}</button>`).join("")}
function summary(){const j=J();
 const L=["MATERIAL RECONCILIATION",`Job: ${j.name||"-"}`,`Contractor: ${j.contractor||"-"}`,`Date: ${j.date}`,"","Structures built:"];
 j.types.forEach(t=>{if(n(j.built[t.id]))L.push(`- ${t.name}: ${n(j.built[t.id])}`)});
 L.push("","Material | Issued | Used | Balance");calc(j).forEach(x=>L.push(`${x.m.name} | ${x.i} | ${x.u} | ${status(x.b)}`));return L.join("\n")}
/* ---- Excel export ---- */
function recSheet(j){
 const A=[["Material reconciliation"],["Job",j.name],["Contractor",j.contractor],["Date",j.date],[],["Structures built"],["Pole type","Qty built","Materials per structure"]];
 j.types.forEach(t=>A.push([t.name,n(j.built[t.id]),bomText(j,t)]));
 A.push([],["Materials"],["Material","Unit","Issued","Used on poles","Other usage","Total used","Balance","Status"]);
 calc(j).forEach(x=>A.push([x.m.name,x.m.unit,x.i,x.u-n(j.extra[x.m.id]),n(j.extra[x.m.id]),x.u,x.b,status(x.b)]));
 const ws=XLSX.utils.aoa_to_sheet(A);ws["!cols"]=[{wch:26},{wch:12},{wch:34},{wch:14},{wch:12},{wch:12},{wch:10},{wch:14}];return ws}
function bomSheet(j){const A=[["Pole type",...j.mats.map(m=>m.name)]];j.types.forEach(t=>A.push([t.name,...j.mats.map(m=>n(t.bom[m.id]))]));
 const ws=XLSX.utils.aoa_to_sheet(A);ws["!cols"]=[{wch:24},...j.mats.map(()=>({wch:16}))];return ws}
const fname=s=>(s||"job").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,40)||"job";
async function saveXlsx(wb,name){
 if(typeof XLSX==="undefined"){toast("Excel library did not load. Check your connection.");return}
 const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
 try{if(window.claude&&claude.use){const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data:buf});toast("Excel file ready");return}}}
 catch(e){if(e&&e.code==="declined")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Excel file downloaded")}
function exportJob(id){const j=S.jobs.find(x=>x.id===id);if(!j)return;const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,recSheet(j),"Reconciliation");XLSX.utils.book_append_sheet(wb,bomSheet(j),"BOM");saveXlsx(wb,`reconciliation_${fname(j.name)}_${j.date}.xlsx`)}
function exportAll(){if(typeof XLSX==="undefined"){toast("Excel library did not load. Check your connection.");return}
 const wb=XLSX.utils.book_new(),seen={};
 const S0=[["Job","Contractor","Date","Structures","Items to return","Items short"]];
 S.jobs.forEach(j=>S0.push([title(j),j.contractor,j.date,j.types.reduce((s,t)=>s+n(j.built[t.id]),0),calc(j).filter(x=>x.b>0).length,calc(j).filter(x=>x.b<0).length]));
 const sw=XLSX.utils.aoa_to_sheet(S0);sw["!cols"]=[{wch:30},{wch:24},{wch:12},{wch:12},{wch:16},{wch:12}];XLSX.utils.book_append_sheet(wb,sw,"Summary");
 S.jobs.forEach(j=>{let nm=title(j).replace(/[\\\/?*\[\]:]/g,"").slice(0,27)||"Job";let k=nm,c=2;while(seen[k.toLowerCase()]||k.toLowerCase()==="summary")k=nm+" "+(c++);seen[k.toLowerCase()]=1;XLSX.utils.book_append_sheet(wb,recSheet(j),k)});
 saveXlsx(wb,`all_jobs_${today()}.xlsx`)}
/* ---- events ---- */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,k=b.dataset.k,j=J();
 if(a!=="del")delC=null;
 if(a==="tab"){tab=id}
 else if(a==="d"){const bag=getBag(k,id);bag[id]=Math.max(0,n(bag[id])+parseInt(b.dataset.d));save()}
 else if(a==="edit"){editing=editing===id?null:id}
 else if(a==="addmat"){const nm=document.getElementById("nm").value.trim();if(!nm)return;j.mats.push({id:"m"+Date.now(),name:nm,unit:document.getElementById("nu").value.trim()||"pcs"});save()}
 else if(a==="addtype"){const nt=document.getElementById("nt").value.trim();if(!nt)return;const tid="t"+Date.now();j.types.push({id:tid,name:nt,bom:{}});editing=tid;save()}
 else if(a==="newjob"){const nj=newJob(j);S.jobs.push(nj);S.cur=nj.id;editing=null;tab="job";save();toast("New job created")}
 else if(a==="open"){S.cur=id;editing=null;tab="job";save()}
 else if(a==="dup"){const o=S.jobs.find(x=>x.id===id),c=clone(o);c.id="j"+Date.now();c.name=(o.name||"Untitled job")+" (copy)";S.jobs.push(c);S.cur=c.id;save();toast("Job duplicated")}
 else if(a==="del"){if(delC!==id){delC=id}else{S.jobs=S.jobs.filter(x=>x.id!==id);if(!S.jobs.length)S.jobs.push(newJob());if(!S.jobs.find(x=>x.id===S.cur))S.cur=S.jobs[0].id;delC=null;save();toast("Job deleted")}}
 else if(a==="expone"){exportJob(id);return}
 else if(a==="expall"){exportAll();return}
 else if(a==="copy"){const t=summary();const done=()=>toast("Summary copied");
  try{navigator.clipboard.writeText(t).then(done,()=>fb(t,done))}catch(x){fb(t,done)};return}
 render()});
function fb(t,done){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");done()}catch(e){}x.remove()}
document.addEventListener("change",e=>{const t=e.target,j=J();
 if(t.id==="jn")j.name=t.value;else if(t.id==="jc")j.contractor=t.value;else if(t.id==="jd")j.date=t.value||today();
 else if(t.dataset.k){getBag(t.dataset.k,t.dataset.id)[t.dataset.id]=n(t.value);render()}
 save()});
render();
</script></body></html>
